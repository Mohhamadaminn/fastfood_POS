{% load i18n %}
<!DOCTYPE html>
<html lang="fa" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Burger POS{% endblock title %}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<style>
:root {
    --primary-red: #e63939;
    --red-dark: #c1121f;
    --surface-1: #141414;
    --surface-2: #1c1c1c;
    --surface-3: #242424;
    --border: #2a2a2a;
    --text-muted: #6b7280;
}

body {
    background: var(--surface-1);
    font-family: 'Inter', system-ui, sans-serif;
    color: #e5e7eb;
}

.navbar {
    background: var(--surface-2) !important;
    border-bottom: 2px solid var(--border);
    padding: 0.75rem 1.5rem;
}

.navbar-brand {
    font-weight: 700;
    font-size: 1.2rem;
    color: white !important;
    letter-spacing: 0.5px;
}

.nav-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: #9ca3af;
    padding: 0.4rem 0.9rem;
    border-radius: 8px;
    font-size: 0.85rem;
    transition: all 0.2s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.nav-btn:hover {
    border-color: var(--primary-red);
    color: white;
    background: rgba(230, 57, 57, 0.08);
}

.card {
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--surface-2);
}

.card-header {
    background: var(--surface-3);
    border-bottom: 1px solid var(--border);
    border-radius: 16px 16px 0 0 !important;
}

.product-card {
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    border-radius: 16px;
    border: 1px solid var(--border);
}

.product-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5);
    border-color: #3a3a3a;
}

.new-order-card {
    border-color: rgba(74, 222, 128, 0.25);
}

.new-order-card:hover {
    border-color: rgba(74, 222, 128, 0.5);
    box-shadow: 0 20px 40px -12px rgba(74, 222, 128, 0.15);
}

.stat-number {
    font-size: 2rem;
    font-weight: 700;
    line-height: 1.1;
}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container-fluid">
<a href="{% url 'home' %}" class="navbar-brand d-flex align-items-center gap-2">
<i class="bi bi-shop" style="color: var(--primary-red); font-size: 1.3rem;"></i>
Burger POS
</a>
<div class="d-flex align-items-center gap-2">
<span class="text-muted small d-none d-md-inline me-1">
<i class="bi bi-clock me-1"></i><span id="current-time"></span>
</span>
<a href="{% url 'dashboard' %}" class="nav-btn">
<i class="bi bi-bar-chart-fill"></i>{% trans "Dashboard" %}
</a>
<a href="{% url 'order-list' %}" class="nav-btn">
<i class="bi bi-clock-history"></i>{% trans "Orders" %}
</a>
<button class="nav-btn">
<i class="bi bi-person-circle"></i>{% trans "Cashier" %}
</button>
</div>
</div>
</nav>
<div class="container-fluid py-4">
{% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script>
function updateTime() {
    document.getElementById('current-time').textContent =
        new Date().toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'});
}
setInterval(updateTime, 1000);
updateTime();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
