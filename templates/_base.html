{% load i18n %}
<!DOCTYPE html>
<html lang="fa" dir="rtl" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{% trans "Burger POS" %}{% endblock title %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<style>
:root {
    --primary-red: #e63939;
    --red-dark: #c1121f;
    --red-light: #ff6b6b;
    --red-glow: rgba(230, 57, 57, 0.18);
    --surface-1: #141414;
    --surface-2: #1c1c1c;
    --surface-3: #242424;
    --surface-4: #2c2c2c;
    --border: #2a2a2a;
    --border-light: #3a3a3a;
    --text-muted: #9a9da5;
    --radius-sm: 10px;
    --radius-md: 16px;
    --shadow-soft: 0 10px 28px -10px rgba(0,0,0,0.5);
    --transition-base: all 0.25s cubic-bezier(0.4,0,0.2,1);
}

* { -webkit-tap-highlight-color: transparent; }

body {
    background: var(--surface-1);
    font-family: 'Vazirmatn', system-ui, sans-serif;
    color: #e5e7eb;
}

.text-muted { color: var(--text-muted) !important; }

/* ---------- Navbar ---------- */
.navbar {
    background: var(--surface-2) !important;
    border-bottom: 2px solid var(--border);
    padding: 0.75rem 1.5rem;
    box-shadow: var(--shadow-soft);
}

.navbar-brand {
    font-weight: 700;
    font-size: 1.2rem;
    color: white !important;
}

.navbar-brand i {
    filter: drop-shadow(0 0 8px var(--red-glow));
}

.time-chip {
    background: var(--surface-3);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0.4rem 0.85rem;
    border-radius: 999px;
    font-size: 0.8rem;
}

/* ---------- Buttons ---------- */
.nav-btn {
    background: var(--surface-3);
    border: 1px solid var(--border);
    color: #9ca3af;
    padding: 0.55rem 1.05rem;
    min-height: 42px;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    font-weight: 500;
    transition: var(--transition-base);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}

.nav-btn i { font-size: 1rem; }

.nav-btn:hover {
    border-color: var(--primary-red);
    color: white;
    background: rgba(230, 57, 57, 0.1);
    transform: translateY(-2px);
    box-shadow: 0 10px 20px -10px var(--red-glow);
}

.nav-btn:active { transform: translateY(0); }

.nav-btn:focus-visible {
    outline: 2px solid var(--primary-red);
    outline-offset: 2px;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary-red);
    box-shadow: 0 0 0 3px var(--red-glow);
    display: inline-block;
}

/* Pill action button used inside cards */
.card-action-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
    padding: 0.45rem 1.1rem;
    min-height: 38px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    transition: var(--transition-base);
}

.card-action-btn-red {
    background: var(--primary-red);
    color: white;
    box-shadow: 0 10px 20px -8px var(--red-glow);
}

.card-action-btn-outline {
    background: transparent;
    border: 1px solid var(--border-light);
    color: #d7d9de;
}

.product-card:hover .card-action-btn-red {
    background: var(--red-dark);
    transform: translateX(-3px);
}

.product-card:hover .card-action-btn-outline {
    border-color: var(--primary-red);
    color: white;
    background: rgba(230, 57, 57, 0.08);
    transform: translateX(-3px);
}

/* ---------- Cards ---------- */
.card {
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--surface-2);
}

.card-header {
    background: var(--surface-3);
    border-bottom: 1px solid var(--border);
    border-radius: var(--radius-md) var(--radius-md) 0 0 !important;
}

.product-card {
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
}

.product-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5);
    border-color: var(--border-light);
}

.new-order-card { border-color: var(--red-glow); }
.new-order-card:hover {
    border-color: rgba(230, 57, 57, 0.45);
    box-shadow: 0 20px 40px -12px var(--red-glow);
}

/* ---------- Icon circles (for the three action cards) ---------- */
.icon-circle {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1rem;
    transition: var(--transition-base);
}

.icon-circle i { font-size: 2.5rem; }

.icon-circle-lg { width: 100px; height: 100px; }
.icon-circle-lg i { font-size: 3rem; }

.product-card:hover .icon-circle { transform: scale(1.06); }

.icon-circle-red {
    background: radial-gradient(circle at 30% 30%, var(--red-light), var(--primary-red) 70%);
    box-shadow: 0 0 0 8px rgba(230,57,57,0.08), 0 18px 30px -10px rgba(230,57,57,0.45);
    color: white;
}

.icon-circle-red-muted {
    background: rgba(193, 18, 31, 0.12);
    box-shadow: inset 0 0 0 1px rgba(193, 18, 31, 0.35);
    color: var(--red-light);
}

.icon-circle-gray {
    background: var(--surface-4);
    box-shadow: inset 0 0 0 1px var(--border-light);
    color: #c7cad1;
}

/* ---------- Stat icon badges ---------- */
.icon-badge {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.icon-badge i { font-size: 1.6rem; }

.icon-badge-red { background: rgba(230, 57, 57, 0.12); color: var(--primary-red); }
.icon-badge-gray {
    background: var(--surface-4);
    color: #c7cad1;
    box-shadow: inset 0 0 0 1px var(--border-light);
}

.stat-number {
    font-size: 2rem;
    font-weight: 700;
    line-height: 1.1;
}

.stat-mini {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.price-tag { color: var(--primary-red); font-weight: 600; }

/* ---------- Status badges ---------- */
.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0.35rem 0.85rem;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    line-height: 1;
}

.status-badge i { font-size: 0.65rem; }

.status-badge-paid {
    background: var(--surface-4);
    color: #c7cad1;
    box-shadow: inset 0 0 0 1px var(--border-light);
}

.status-badge-open {
    background: rgba(230, 57, 57, 0.14);
    color: var(--red-light);
    box-shadow: inset 0 0 0 1px rgba(230, 57, 57, 0.35);
}

/* ---------- POS action buttons ---------- */
.btn-pos-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--primary-red);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    padding: 0.75rem 1.5rem;
    min-height: 48px;
    font-weight: 700;
    font-size: 0.95rem;
    transition: var(--transition-base);
    text-decoration: none;
    cursor: pointer;
}

.btn-pos-primary:hover {
    background: var(--red-dark);
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 14px 28px -10px var(--red-glow);
}

.btn-pos-primary:active { transform: translateY(0); }

.btn-pos-secondary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--surface-3);
    color: #9ca3af;
    border: 1px solid var(--border-light);
    border-radius: var(--radius-sm);
    padding: 0.75rem 1.5rem;
    min-height: 48px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: not-allowed;
}

.btn-pos-sm {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px solid var(--border-light);
    color: #c7cad1;
    padding: 0.4rem 0.95rem;
    min-height: 34px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    transition: var(--transition-base);
    text-decoration: none;
}

.btn-pos-sm:hover {
    border-color: var(--primary-red);
    color: white;
    background: rgba(230, 57, 57, 0.1);
}

.btn-pos-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-3);
    border: 1px solid var(--border);
    color: var(--text-muted);
    transition: var(--transition-base);
    cursor: pointer;
}

.btn-pos-icon:hover {
    background: var(--primary-red);
    border-color: var(--primary-red);
    color: white;
}

/* ---------- Quantity stepper ---------- */
.qty-stepper {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
}

.qty-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: var(--surface-4);
    color: #e5e7eb;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition-base);
    cursor: pointer;
}

.qty-btn:hover { background: var(--primary-red); color: white; }

.qty-value {
    min-width: 30px;
    text-align: center;
    font-weight: 700;
    color: white;
}

/* ---------- Tables ---------- */
.table { color: #e5e7eb; }

.table > :not(caption) > * > * {
    border-bottom-color: var(--border);
    background-color: transparent;
}

.table thead th {
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.8rem;
    border-bottom: 1px solid var(--border) !important;
}

.table-hover > tbody > tr:hover > * {
    background-color: rgba(230, 57, 57, 0.05);
}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container-fluid">
<a href="{% url 'home' %}" class="navbar-brand d-flex align-items-center gap-2">
<i class="bi bi-shop" style="color: var(--primary-red); font-size: 1.3rem;"></i>
{% trans "Burger POS" %}
</a>
<div class="d-flex align-items-center gap-2">
<span class="time-chip d-none d-md-inline-flex align-items-center gap-1">
<i class="bi bi-clock"></i><span id="current-time"></span>
</span>
<a href="{% url 'dashboard' %}" class="nav-btn" title="{% trans 'Dashboard' %}">
<i class="bi bi-bar-chart-fill"></i>
<span class="d-none d-sm-inline">{% trans "Dashboard" %}</span>
</a>
<a href="{% url 'order-list' %}" class="nav-btn" title="{% trans 'Orders' %}">
<i class="bi bi-clock-history"></i>
<span class="d-none d-sm-inline">{% trans "Orders" %}</span>
</a>
<button type="button" class="nav-btn" title="{% trans 'Cashier' %}">
<i class="bi bi-person-circle"></i>
<span class="d-none d-sm-inline">{% trans "Cashier" %}</span>
<span class="status-dot"></span>
</button>
</div>
</div>
</nav>
<div class="container-fluid py-4">
{% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script>
function updateTime() {
    document.getElementById('current-time').textContent =
        new Date().toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'});
}
setInterval(updateTime, 1000);
updateTime();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
