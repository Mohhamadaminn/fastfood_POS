{% load i18n %}

<!DOCTYPE html>
<html lang="fa" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock title %}</title>
    
    <!-- Google Font - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        :root {
            --primary-red: #e63939;
            --red-dark: #c1121f;
            --red-light: #f77f7f;
        }
        
        body {
            background: #0f0f0f;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .navbar {
            background: #1a1a1a !important;
            border-bottom: 3px solid var(--primary-red);
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: 1px;
            color: white !important;
        }

        .navbar-brand i {
            color: var(--primary-red);
        }

        .product-card {
            cursor: pointer;
            transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            border-radius: 20px;
            border: 1px solid #222;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgb(230 57 57 / 0.15), 0 8px 10px -6px rgb(230 57 57 / 0.1);
        }

        .product-card:hover img {
            transform: scale(1.1);
        }

        .card {
            border-radius: 20px;
            border: 1px solid #222;
            background: #181818;
        }

        .card-header {
            background: #1f1f1f;
            border-bottom: 1px solid #333;
        }

        .btn-outline-danger {
            border-color: var(--primary-red);
            color: var(--primary-red);
        }

        .btn-outline-danger:hover {
            background-color: var(--primary-red);
            color: white;
        }

        .btn-outline-success {
            border-color: #4ade80;
            color: #4ade80;
        }

        .table { margin-bottom: 0; }
        .order-table td { vertical-align: middle; }

        .total-box {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-red);
        }

        .disabled-product {
            opacity: .45;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark border-bottom">
        <div class="container-fluid">
            <span class="navbar-brand">
                <i class="bi bi-shop"></i>
                <span class="ms-2">{% trans "Burger" %}</span> <span style="color: var(--primary-red);">POS</span>
            </span>
        </div>
    </nav>

    <div class="container-fluid py-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
