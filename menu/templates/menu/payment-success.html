{% extends "_base.html" %}

{% block title %}
Payment Successful
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-6">

        <div
            class="card shadow text-center"
            style="
                margin-top:100px;
                border:2px solid #4ade80;
            "
        >

            <div class="card-body p-5">

                <div class="mb-4">

                    <i
                        class="bi bi-check-circle-fill"
                        style="
                            font-size:90px;
                            color:#4ade80;
                        "
                    ></i>

                </div>

                <h1
                    class="fw-bold mb-3"
                    style="color:#4ade80;"
                >

                    Payment Successful

                </h1>

                <p
                    class="text-muted fs-5 mb-4"
                >

                    Order #{{ request.session.last_paid_order }}
                    has been paid successfully.

                </p>

                <a
                    href="{% url 'order-create' %}"
                    class="btn btn-success btn-lg px-5"
                >

                    <i class="bi bi-plus-circle me-2"></i>

                    Create New Order

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
